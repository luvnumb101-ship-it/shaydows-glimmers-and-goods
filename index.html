<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaydow's Glimmers & Goods</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #f5f1e8;
            --deep-plum: #5a2a4a;
            --charcoal: #2a2a2a;
            --sage: #8a9a7e;
            --gold: #b8956a;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--cream);
            color: var(--charcoal);
            line-height: 1.7;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
        }

        .cursive {
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--deep-plum) 0%, var(--charcoal) 100%);
            color: var(--cream);
            padding: 2rem 0;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 6px var(--shadow);
        }

        .logo-container {
            max-width: 200px;
            margin: 0 auto 1rem;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            border-radius: 50%;
            border: 4px solid var(--gold);
            box-shadow: 0 6px 12px var(--shadow);
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
        }

        header .tagline {
            font-size: 1.3rem;
            font-style: italic;
            color: var(--gold);
            margin-top: 0.5rem;
        }

        /* Navigation */
        nav {
            background-color: var(--charcoal);
            padding: 1rem 0;
            box-shadow: 0 2px 4px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--cream);
            text-decoration: none;
            font-size: 1.2rem;
            font-family: 'Playfair Display', serif;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        nav a:hover {
            color: var(--gold);
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(42, 42, 42, 0.6), rgba(90, 42, 74, 0.6)),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%238a9a7e" width="1200" height="600"/></svg>');
            background-size: cover;
            background-position: center;
            color: var(--cream);
            padding: 6rem 2rem;
            text-align: center;
        <span class="ml-2" /><span class="inline-block w-3 h-3 rounded-full bg-neutral-a12 align-middle mb-[0.1rem]" />
